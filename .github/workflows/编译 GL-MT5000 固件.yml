name: 编译 GL-MT5000 固件
run-name: ${{ github.event.inputs.debug == 'true' && '🛠️ 测试配置 (仅生成 Config)' || '🚀 正式编译' }} - ${{ github.event.inputs.source_branch }} - ${{ github.event.inputs.config_version }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_version:
        description: "选择配置目录"
        required: false
        default: "aqr-k-MT5000-24.10"
        type: choice
        options:
          - aqr-k-MT5000-24.10
          - aqr-k-MT5000-25.12

      source_branch:
        description: "选择源码分支 (决定 OpenWrt 内核/组件版本)"
        required: true
        default: "MT5000-24.10"
        type: choice
        options:
          - MT5000-main
          - MT5000-24.10
          - MT5000-25.12

      ssh:
        description: '是否开启 SSH 远程调试'
        required: false
        type: boolean
        default: false

      debug:
        description: '不编译内容，只生成 config'
        required: false
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/Aqr-K/openwrt
  REPO_BRANCH: ${{ github.event.inputs.source_branch }}
  # 路径配置
  FEEDS_CONF: config/${{ github.event.inputs.config_version }}/feeds.conf
  CONFIG_FILE: config/${{ github.event.inputs.config_version }}/config
  DIY_P1_SH: config/${{ github.event.inputs.config_version }}/diy-part1.sh
  DIY_P2_SH: config/${{ github.event.inputs.config_version }}/diy-part2.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: 开始编译固件
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) ccache
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 OpenWrt 源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 缓存下载目录 (dl)
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-

    - name: 缓存编译器缓存 (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-

    - name: 加载自定义 Feeds & 执行 DIY 脚本 (Part 1)
      run: |
        [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新并安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 (Part 2)
      run: |
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config 
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        make defconfig
        
    - name: 打印最终有效 .config 配置
      run: |
        echo "================== 最终有效配置清单 =================="
        # 过滤掉注释行和空行，只显示生效的选项
        grep -v '^#' openwrt/.config | grep -v '^$'
        echo "===================================================="

    - name: SSH 远程调试 (tmate)
      uses: mxschmitt/action-tmate@v3
      continue-on-error: true
      if: (github.event.inputs.ssh == 'true')
      with:
        limit-access-to-actor: true

    - name: 上传调试用 .config 文件
      if: (github.event.inputs.debug == 'false')
      uses: actions/upload-artifact@v4
      with:
        name: config-debug-${{ github.event.inputs.source_branch }}
        path: openwrt/.config

    - name: 下载软件包源码 (Download)
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 执行固件编译
      id: compile
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        ccache -M 5G
        echo -e "$(nproc) 线程编译中..."
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理输出文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        # # 优先级：.config里的定义 > include/version.mk > 默认为 SNAPSHOT
        # VERSION_V=$(grep "CONFIG_VERSION_NUMBER=" openwrt/.config | cut -d'=' -f2 | sed 's/"//g')
        # [ -z "$VERSION_V" ] && VERSION_V=$(grep "VERSION_NUMBER:=" openwrt/include/version.mk | cut -d'=' -f2)
        # [ -z "$VERSION_V" ] && VERSION_V="SNAPSHOT"
        # echo "OWRT_VERSION=$VERSION_V" >> $GITHUB_OUTPUT
        
        mkdir -p $GITHUB_WORKSPACE/output
        cd openwrt/bin/targets/mediatek/filogic/
        cp -f *.bin $GITHUB_WORKSPACE/output/ || true
        cp -f *.tar.gz $GITHUB_WORKSPACE/output/ || true
        echo "FIRMWARE_PATH=$GITHUB_WORKSPACE/output" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件至工作流附件 (Artifacts)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        # name: OpenWrt_MT5000_${{ steps.organize.outputs.OWRT_VERSION }}_固件
        name: OpenWrt_${{ github.event.inputs.source_branch }}
        path: ${{ steps.organize.outputs.FIRMWARE_PATH }}
        retention-days: 7

    - name: 生成发布标签 (Release Tag)
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=MT5000-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "release_date=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ steps.organize.outputs.FIRMWARE_PATH }}/*
        body: |
          ## GL-MT5000 (Beryl AX) 固件发布
          - 📅 编译日期: ${{ steps.tag.outputs.release_date }}
          - 📂 配置目录: config/${{ github.event.inputs.config_version }}
          - 🔗 源码分支: ${{ env.REPO_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧运行记录
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3
        token: ${{ secrets.GITHUB_TOKEN }}
