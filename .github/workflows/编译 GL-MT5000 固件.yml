name: 编译 GL-MT5000 固件
run-name: ${{ github.event.inputs.debug == 'true' && '🛠️ 测试配置 (仅生成 Config)' || '🚀 正式编译' }} - ${{ github.event.inputs.source_branch }} - ${{ github.event.inputs.config_version }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_version:
        description: "选择配置目录"
        required: true
        default: "aqr-k-MT5000-24.10"
        type: choice
        options:
          - aqr-k-MT5000-24.10
          - aqr-k-MT5000-25.12

      source_branch:
        description: "选择源码分支 (决定 OpenWrt 内核/组件版本)"
        required: true
        default: "MT5000-24.10"
        type: choice
        options:
          - MT5000-main
          - MT5000-24.10
          - MT5000-25.12

      ssh:
        description: '是否开启 SSH 远程调试'
        required: false
        type: boolean
        default: false

      debug:
        description: '不编译，只查看最终 .config'
        required: false
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/Aqr-K/openwrt
  REPO_BRANCH: ${{ github.event.inputs.source_branch }}
  # 路径配置
  FEEDS_CONF: config/${{ github.event.inputs.config_version }}/feeds.conf
  CONFIG_FILE: config/${{ github.event.inputs.config_version }}/config
  DIY_P1_SH: config/${{ github.event.inputs.config_version }}/diy-part1.sh
  DIY_P2_SH: config/${{ github.event.inputs.config_version }}/diy-part2.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: 开始编译固件
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) ccache
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 OpenWrt 源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    # ==================== 恢复缓存阶段 ====================
    - name: 恢复下载目录缓存 (dl)
      uses: actions/cache/restore@v4
      with:
        path: /workdir/openwrt/dl 
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-

    - name: 恢复编译器缓存 (ccache)
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-

    - name: 恢复工具链缓存 (Toolchain)
      id: cache-toolchain
      uses: actions/cache/restore@v4
      with:
        path: |
          /workdir/openwrt/staging_dir/host*
          /workdir/openwrt/staging_dir/toolchain-*
          /workdir/openwrt/build_dir/host*
          /workdir/openwrt/build_dir/toolchain-*
        key: ${{ runner.os }}-toolchain-${{ env.REPO_BRANCH }}-${{ hashFiles(env.CONFIG_FILE) }}
    # ======================================================

    # ==================== 构建准备阶段 =====================
    - name: 加载自定义 Feeds & 执行 DIY 脚本 (Part 1)
      run: |
        [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 (Part 2) & 生成配置
      run: |
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config 
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
        make defconfig

    - name: 输出最终 .config (Debug 模式)
      if: github.event.inputs.debug == 'true'
      run: |
        cd openwrt
        echo "========== 最终 .config (make defconfig 后) =========="
        cat .config
        echo "========== diffconfig =========="
        ./scripts/diffconfig.sh

    - name: SSH 远程调试 (tmate)
      uses: mxschmitt/action-tmate@v3
      continue-on-error: true
      if: (github.event.inputs.ssh == 'true')
      with:
        limit-access-to-actor: true

    - name: 下载软件包源码 (Download)
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
    # ======================================================

    # ==================== 拆分编译阶段 =====================
    - name: 编译配置 ccache 环境变量
      if: (github.event.inputs.debug == 'false')
      run: |
        echo "CCACHE_DIR=/home/runner/.ccache" >> $GITHUB_ENV
        echo "CCACHE_BASEDIR=/workdir/openwrt" >> $GITHUB_ENV
        echo "CCACHE_COMPRESS=true" >> $GITHUB_ENV
        echo "CCACHE_COMPRESSLEVEL=6" >> $GITHUB_ENV
        ccache -M 2G
        ccache -z

    - name: 阶段 1 - 编译宿主机工具 (Tools)
      if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event.inputs.debug == 'false'
      run: |
        cd openwrt
        echo "正在构建 Tools..."
        make tools/install -j$(nproc) || make tools/install -j1 V=s

    - name: 阶段 2 - 编译交叉工具链 (Toolchain)
      if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event.inputs.debug == 'false'
      run: |
        cd openwrt
        echo "正在构建 Toolchain..."
        make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

    - name: 阶段 3 - 编译内核及驱动 (Target)
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        echo "正在构建 Target (Kernel)..."
        make target/compile -j$(nproc) || make target/compile -j1 V=s

    - name: 阶段 4 - 编译各类插件及依赖 (Package)
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        echo "正在构建 Packages..."
        # IGNORE_ERRORS 参数可防止非致命插件错误中断整体流程
        make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j1 V=s

    - name: 阶段 5 - 打包生成最终固件 (Install)
      id: compile
      if: (github.event.inputs.debug == 'false')
      run: |
        cd openwrt
        echo "正在打包固件..."
        make package/install -j$(nproc) || make package/install -j1 V=s
        make target/install -j$(nproc) || make target/install -j1 V=s
        make checksum
        echo "================== CCACHE 统计信息 =================="
        ccache -s
        echo "===================================================="
        echo "status=success" >> $GITHUB_OUTPUT
    # ======================================================
    
    # ==================== 保存缓存阶段 =====================
    - name: 保存下载目录缓存 (dl)
      uses: actions/cache/save@v4
      if: github.event.inputs.debug == 'false' && !cancelled()
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('**/Makefile') }}

    - name: 保存编译器缓存 (ccache)
      uses: actions/cache/save@v4
      if: github.event.inputs.debug == 'false' && !cancelled()
      with:
        path: /home/runner/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: 保存工具链缓存 (staging_dir)
      uses: actions/cache/save@v4
      # 只有在没有命中旧缓存，并且编译成功时，才需要执行保存操作
      if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event.inputs.debug == 'false' && success()
      with:
        path: openwrt/staging_dir
        key: ${{ runner.os }}-openwrt-toolchain-${{ env.REPO_BRANCH }}-${{ hashFiles(env.CONFIG_FILE) }}
    # ================================================================

    - name: 整理输出文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |    
        mkdir -p $GITHUB_WORKSPACE/output
        cd openwrt/bin/targets/mediatek/filogic/
        cp -f *.bin $GITHUB_WORKSPACE/output/ || true
        cp -f *.tar.gz $GITHUB_WORKSPACE/output/ || true
        echo "FIRMWARE_PATH=$GITHUB_WORKSPACE/output" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件至工作流附件
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_${{ github.event.inputs.source_branch }}
        path: ${{ steps.organize.outputs.FIRMWARE_PATH }}
        retention-days: 7

    - name: 生成发布标签 (Release Tag)
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=MT5000-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "release_date=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ steps.organize.outputs.FIRMWARE_PATH }}/*
        body: |
          ## GL-MT5000 (Beryl AX) 固件发布
          - 📅 编译日期: ${{ steps.tag.outputs.release_date }}
          - 📂 配置目录: config/${{ github.event.inputs.config_version }}
          - 🔗 源码分支: ${{ env.REPO_BRANCH }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧运行记录
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        retain_days: 1
        keep_minimum_runs: 3
