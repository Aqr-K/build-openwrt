name: 编译 GL-MT5000 固件
run-name: ${{ github.event.inputs.debug == 'true' && '🛠️ 测试配置 (仅生成 Config)' || '🚀 正式编译' }} - ${{ github.event.inputs.source_branch }} - ${{ github.event.inputs.config_version }}

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      config_version:
        description: "选择配置目录"
        required: true
        default: "aqr-k-MT5000-25.12"
        type: choice
        options:
          - aqr-k-MT5000-24.10
          - aqr-k-MT5000-25.12

      source_branch:
        description: "选择源码分支 (决定 OpenWrt 内核/组件版本)"
        required: true
        default: "MT5000-25.12"
        type: choice
        options:
          - MT5000-main
          - MT5000-24.10
          - MT5000-25.12

      ssh:
        description: "是否开启 SSH 远程调试"
        required: false
        type: boolean
        default: false

      debug:
        description: "不编译，只查看最终 .config"
        required: false
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/Aqr-K/openwrt
  REPO_BRANCH: ${{ github.event.inputs.source_branch }}
  # 路径配置
  FEEDS_CONF: config/${{ github.event.inputs.config_version }}/feeds.conf
  CONFIG_FILE: config/${{ github.event.inputs.config_version }}/config
  DIY_P1_SH: config/${{ github.event.inputs.config_version }}/diy-part1.sh
  DIY_P2_SH: config/${{ github.event.inputs.config_version }}/diy-part2.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: ${{ github.event.inputs.debug == 'true' && '🛠️ 测试配置 (仅生成 Config)' || '🚀 正式编译' }}
    runs-on: ubuntu-22.04

    steps:
      - name: 检出当前仓库
        uses: actions/checkout@v4

      - name: 初始化编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204) ccache
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 克隆 OpenWrt 源码
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      # ==================== 构建准备阶段 =====================
      - name: 加载自定义 Feeds & 执行 DIY 脚本 (Part 1)
        run: |
          [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
          chmod +x $DIY_P1_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P1_SH
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载自定义配置 (Part 2) & 生成配置
        run: |
          [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config 
          chmod +x $DIY_P2_SH
          cd openwrt
          $GITHUB_WORKSPACE/$DIY_P2_SH
          grep -q '^CONFIG_CCACHE=y' .config || echo 'CONFIG_CCACHE=y' >> .config
          make defconfig

      - name: 检查配置一致性 (Dependency Check)
        id: checkconfig
        continue-on-error: true
        run: |
          cd openwrt
          echo "========== 自定义配置一致性检查 =========="
          # 1. 提取原始配置中用户想要激活的项（包含 =y, =m, 以及字符串/数字配置）
          # 排除注释行和“is not set”行
          grep '^CONFIG_' $GITHUB_WORKSPACE/$CONFIG_FILE | grep -v 'is not set' | sort > /tmp/my_configs.txt
          
          MISSING_COUNT=0
          # 2. 逐行比对最终的 .config
          while read -r line; do
            # 使用 -x (精确行匹配) 和 -F (固定字符串)
            if ! grep -qFx "$line" .config; then
              echo "❌ [丢失]: $line"
              MISSING_COUNT=$((MISSING_COUNT + 1))
            fi
          done < /tmp/my_configs.txt

          if [ $MISSING_COUNT -eq 0 ]; then
            echo "✅ 恭喜！所有自定义配置均已成功保留。"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "----------------------------------------"
            echo "⚠️  注意：以上 $MISSING_COUNT 项配置在最终生成的配置中消失了！"
            echo "常见原因：1. 包名拼写错误 2. 缺少上游依赖库 3. 内核版本不匹配"
            echo "----------------------------------------"
            echo "status=warn" >> $GITHUB_OUTPUT
          fi

      - name: SSH 调试配置一致性检查阶段 (仅失败触发)
        if: steps.checkconfig.outputs.status != 'success' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: 配置一致性 终审
        if: github.event.inputs.debug == 'false'
        run: |
          if [ "${{ steps.checkconfig.outcome }}" == "success" ] || [ -f /tmp/fixed_config ]; then
            echo "✅ 配置一致性检查通过"
          else
            echo "❌ 配置检查失败。排查建议："
            echo "1. 检查 feeds.conf 是否漏掉了对应的仓库"
            echo "2. 进入 SSH 手动执行 'make menuconfig' 查找该包，看底层依赖什么"
            echo "3. 修复后在 SSH 中执行 'touch /tmp/fixed_config' 并退出即可跳过此报错"
          fi

      - name: 输出最终 .config (Debug 模式)
        run: |
          cd openwrt
          echo "========== 最终 .config (make defconfig 后) =========="
          cat .config
          echo "========== diffconfig =========="
          ./scripts/diffconfig.sh

      - name: SSH 远程调试 (tmate)
        uses: mxschmitt/action-tmate@v3
        continue-on-error: true
        if: (github.event.inputs.ssh == 'true')
        with:
          limit-access-to-actor: true

      - name: 下载软件包源码 (Download)
        if: (github.event.inputs.debug == 'false')
        run: |
          cd openwrt
          make download -j$(nproc)
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      # ==================== 恢复缓存阶段 ====================
      - name: 提取并生成缓存指纹信息
        id: fingerprint
        if: github.event.inputs.debug == 'false'
        run: |
          # 提取独立指纹
          echo "TOOLS_HASH=$(sha256sum include/tools.mk | awk '{print $1}')" >> $GITHUB_OUTPUT
          grep -E '^CONFIG_TARGET_|^CONFIG_GCC_|^CONFIG_BINUTILS_|^CONFIG_LIBC_|^CONFIG_USE_|^CONFIG_LINUX_|^CONFIG_SSP_|^CONFIG_LTO' .config | sort > core_toolchain.txt
          echo "TOOLCHAIN_HASH=$(sha256sum core_toolchain.txt | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: 恢复 DL 缓存
        uses: actions/cache/restore@v4
        if: github.event.inputs.debug == 'false'
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-

      - name: 恢复 Ccache 缓存
        uses: actions/cache/restore@v4
        if: github.event.inputs.debug == 'false'
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-

      - name: 恢复 Tools 缓存
        id: cache-tools
        uses: actions/cache/restore@v4
        if: github.event.inputs.debug == 'false'
        with:
          path: |
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/build_dir/host
          key: ${{ runner.os }}-tools-${{ steps.fingerprint.outputs.TOOLS_HASH }}

      - name: 恢复 Toolchain 缓存
        id: cache-toolchain
        uses: actions/cache/restore@v4
        if: github.event.inputs.debug == 'false'
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/build_dir/toolchain-*
          key: ${{ runner.os }}-toolchain-${{ env.REPO_BRANCH }}-${{ steps.fingerprint.outputs.TOOLCHAIN_HASH }}

      # ==================== 拆分编译阶段 =====================
      - name: 编译配置 ccache 环境变量
        if: (github.event.inputs.debug == 'false')
        run: |
          echo "CCACHE_DIR=/home/runner/.ccache" >> $GITHUB_ENV
          echo "CCACHE_BASEDIR=/workdir/openwrt" >> $GITHUB_ENV
          ccache -M 2G
          ccache -z
          
          TARGET_PATH="/workdir/openwrt/staging_dir/host/bin/ccache"
          if [ ! -f "$TARGET_PATH" ]; then
            echo "⚠️ 检测到初次编译，手动建立临时链接以防报错..."
            mkdir -p "$(dirname "$TARGET_PATH")"
            ln -sf /usr/bin/ccache "$TARGET_PATH"
          fi

      # ------------------ 阶段 1: Tools ------------------
      - name: 阶段 1 - 编译宿主机工具 (Tools)
        id: stage1
        if: steps.cache-tools.outputs.cache-hit != 'true' && github.event.inputs.debug == 'false'
        continue-on-error: true
        run: |
          cd /workdir/openwrt
          make tools/install -j$(nproc) || make tools/install -j1 V=s

      - name: SSH 调试阶段 1 (仅失败触发)
        if: steps.stage1.outcome == 'failure' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: 阶段 1 终审
        if: github.event.inputs.debug == 'false'
        run: |
          # 逻辑：如果之前成功了，或用户在 SSH 里手动编译通过了，则通过
          cd /workdir/openwrt
          if [ "${{ steps.stage1.outcome }}" != "failure" ] || [ -f /tmp/fixed_stage1 ]; then
            echo "阶段 1 通过"
          else
            echo "阶段 1 失败且未修复。提示：进入 SSH 修复后执行 'touch /tmp/fixed_stage1' 并退出即可跳过此报错。"
            exit 1
          fi

      # ------------------ 阶段 2: Toolchain ------------------
      - name: 阶段 2 - 编译交叉工具链 (Toolchain)
        id: stage2
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && github.event.inputs.debug == 'false'
        continue-on-error: true
        run: |
          cd /workdir/openwrt
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: SSH 调试阶段 2 (仅失败触发)
        if: steps.stage2.outcome == 'failure' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: 阶段 2 终审
        if: github.event.inputs.debug == 'false'
        run: |
          if [ "${{ steps.stage2.outcome }}" != "failure" ] || [ -f /tmp/fixed_stage2 ]; then
            echo "阶段 2 通过"
          else
            exit 1
          fi

      # ------------------ 阶段 3: Target ------------------
      - name: 阶段 3 - 编译内核及驱动 (Target)
        id: stage3
        if: github.event.inputs.debug == 'false'
        continue-on-error: true
        run: |
          cd /workdir/openwrt
          make target/compile -j$(nproc) || make target/compile -j1 V=s

      - name: SSH 调试阶段 3 (仅失败触发)
        if: steps.stage3.outcome == 'failure' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: 阶段 3 终审
        if: github.event.inputs.debug == 'false'
        run: |
          if [ "${{ steps.stage3.outcome }}" != "failure" ] || [ -f /tmp/fixed_stage3 ]; then
            echo "阶段 3 通过"
          else
            exit 1
          fi

      # ------------------ 阶段 4: Package ------------------
      - name: 阶段 4 - 编译各类插件及依赖 (Package)
        id: stage4
        if: github.event.inputs.debug == 'false'
        continue-on-error: true
        run: |
          cd /workdir/openwrt
          make package/compile -j$(nproc) IGNORE_ERRORS=1 || make package/compile -j1 V=s

      - name: SSH 调试阶段 4 (仅失败触发)
        if: steps.stage4.outcome == 'failure' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: 阶段 4 终审
        if: github.event.inputs.debug == 'false'
        run: |
          if [ "${{ steps.stage4.outcome }}" != "failure" ] || [ -f /tmp/fixed_stage4 ]; then
            echo "阶段 4 通过"
          else
            exit 1
          fi

      # ------------------ 阶段 5: Install ------------------
      - name: 阶段 5 - 打包生成最终固件 (Install)
        id: compile
        if: github.event.inputs.debug == 'false'
        continue-on-error: true
        run: |
          cd /workdir/openwrt
          make package/install -j$(nproc) || make package/install -j1 V=s
          make target/install -j$(nproc) || make target/install -j1 V=s
          make checksum
          echo "status=success" >> $GITHUB_OUTPUT

      - name: SSH 调试阶段 5 (仅失败触发)
        if: steps.compile.outcome == 'failure' && github.event.inputs.ssh == 'true'
        uses: mxschmitt/action-tmate@v3

      - name: 阶段 5 终审
        if: github.event.inputs.debug == 'false'
        run: |
          if [ "${{ steps.compile.outcome }}" != "failure" ] || [ -f /tmp/fixed_stage5 ]; then
            echo "status=success" >> $GITHUB_OUTPUT # 确保保存缓存阶段能看到成功状态
          else
            exit 1
          fi

      # ==================== 保存缓存阶段 ====================
      - name: 保存 DL 缓存
        uses: actions/cache/save@v4
        if: success() && !cancelled() && github.event.inputs.debug == 'false'
        with:
          path: /workdir/openwrt/dl
          key: ${{ runner.os }}-dl-${{ env.REPO_BRANCH }}-${{ github.run_id }}

      - name: 保存 Ccache 缓存
        uses: actions/cache/save@v4
        if: success() && !cancelled() && github.event.inputs.debug == 'false'
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}

      - name: 保存 Tools 缓存
        uses: actions/cache/save@v4
        if: steps.cache-tools.outputs.cache-hit != 'true' && success() && github.event.inputs.debug == 'false' && !cancelled()
        with:
          path: |
            /workdir/openwrt/staging_dir/host
            /workdir/openwrt/build_dir/host
          key: ${{ runner.os }}-tools-${{ steps.fingerprint.outputs.TOOLS_HASH }}

      - name: 保存 Toolchain 缓存
        uses: actions/cache/save@v4
        if: steps.cache-toolchain.outputs.cache-hit != 'true' && success() && github.event.inputs.debug == 'false' && !cancelled()
        with:
          path: |
            /workdir/openwrt/staging_dir/toolchain-*
            /workdir/openwrt/build_dir/toolchain-*
          key: ${{ runner.os }}-toolchain-${{ env.REPO_BRANCH }}-${{ steps.fingerprint.outputs.TOOLCHAIN_HASH }}

      # ==================== 整理发布阶段 ====================
      - name: 整理输出文件
        id: organize
        if: steps.compile.outputs.status == 'success' && !cancelled()
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cd openwrt/bin/targets/mediatek/filogic/
          cp -f *.bin $GITHUB_WORKSPACE/output/ || true
          cp -f *.tar.gz $GITHUB_WORKSPACE/output/ || true
          echo "FIRMWARE_PATH=$GITHUB_WORKSPACE/output" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传固件至工作流附件
        uses: actions/upload-artifact@v4
        if: steps.organize.outputs.status == 'success' && !cancelled()
        with:
          name: OpenWrt_${{ github.event.inputs.source_branch }}
          path: ${{ steps.organize.outputs.FIRMWARE_PATH }}
          retention-days: 7

      - name: 生成发布标签 (Release Tag)
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
        run: |
          echo "release_tag=MT5000-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
          echo "release_date=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 发布至 GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success' && !cancelled()
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          files: ${{ steps.organize.outputs.FIRMWARE_PATH }}/*
          body: |
            ## GL-MT5000 (Beryl AX) 固件发布
            - 📅 编译日期: ${{ steps.tag.outputs.release_date }}
            - 📂 配置目录: config/${{ github.event.inputs.config_version }}
            - 🔗 源码分支: ${{ env.REPO_BRANCH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 清理旧运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 1
          keep_minimum_runs: 3
