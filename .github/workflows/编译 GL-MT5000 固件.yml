name: 编译 GL-MT5000 固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "选择源码分支"
        required: false
        default: "aqr-k-MT5000"
        type: choice
        options:
          - aqr-k-MT5000
          - openwrt-main
          - immortalwrt-master

      ssh:
        description: '是否开启 SSH 远程调试'
        required: false
        type: boolean
        default: false

env:
  REPO_URL: https://github.com/Aqr-K/openwrt
  REPO_BRANCH: MT5000
  # 路径配置
  FEEDS_CONF: config/${{ github.event.inputs.source_branch }}/feeds.conf.default
  CONFIG_FILE: config/${{ github.event.inputs.source_branch }}/config
  DIY_P1_SH: config/${{ github.event.inputs.source_branch }}/diy-part1.sh
  DIY_P2_SH: config/${{ github.event.inputs.source_branch }}/diy-part2.sh
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    name: 开始编译固件
    runs-on: ubuntu-22.04

    steps:
    - name: 检出当前仓库
      uses: actions/checkout@v4

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install $(curl -fsSL https://is.gd/depends_ubuntu_2204)
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆 OpenWrt 源码
      working-directory: /workdir
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: 显示 OpenWrt 版本信息
      run: |
        cd openwrt
        echo "==============================="
        echo "当前源码版本信息："
        if [ -f include/version.mk ]; then
          grep "VERSION_NUMBER:=" include/version.mk | sed 's/VERSION_NUMBER:=/版本号: /'
          grep "VERSION_DIST:=" include/version.mk | sed 's/VERSION_DIST:=/固件名: /'
        fi
        if [ -f package/base-files/files/etc/openwrt_release ]; then
          cat package/base-files/files/etc/openwrt_release
        fi
        echo "==============================="

    - name: 缓存下载目录 (dl)
      uses: actions/cache@v4
      with:
        path: openwrt/dl
        key: ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-${{ hashFiles('**/Makefile') }}
        restore-keys: |
          ${{ runner.os }}-openwrt-dl-${{ env.REPO_BRANCH }}-

    - name: 缓存编译器缓存 (ccache)
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-openwrt-ccache-${{ env.REPO_BRANCH }}-

    - name: 加载自定义 Feeds & 执行 DIY 脚本 (Part 1)
      run: |
        [ -e $FEEDS_CONF ] && cp -f $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: 更新并安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载自定义配置 & 注入预装包 (Part 2)
      run: |
        [ -e $CONFIG_FILE ] && cp -f $CONFIG_FILE openwrt/.config
        
        # 强制注入 MT5000 硬件配置及你的需求包 (已过滤不兼容驱动)
        cat >> openwrt/.config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y
        CONFIG_CCACHE=y
        CONFIG_PACKAGE_autocore=y
        CONFIG_PACKAGE_bash=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_ca-bundle=y
        CONFIG_PACKAGE_coremark=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_dnsmasq-full=y
        CONFIG_PACKAGE_ds-lite=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_firewall4=y
        CONFIG_PACKAGE_fstools=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_kmod-button-hotplug=y
        CONFIG_PACKAGE_kmod-fs-f2fs=y
        CONFIG_PACKAGE_kmod-fs-vfat=y
        CONFIG_PACKAGE_kmod-lib-zstd=y
        CONFIG_PACKAGE_kmod-mmc=y
        CONFIG_PACKAGE_kmod-sdhci=y
        CONFIG_PACKAGE_kmod-tcp-bbr=y
        CONFIG_PACKAGE_kmod-usb-hid=y
        CONFIG_PACKAGE_luci-app-advancedplus=y
        CONFIG_PACKAGE_luci-app-fan=y
        CONFIG_PACKAGE_luci-app-filemanager=y
        CONFIG_PACKAGE_luci-app-firewall=y
        CONFIG_PACKAGE_luci-app-package-manager=y
        CONFIG_PACKAGE_luci-app-syscontrol=y
        CONFIG_PACKAGE_luci-app-upnp=y
        CONFIG_PACKAGE_luci-app-wizard=y
        CONFIG_PACKAGE_luci-proto-wireguard=y
        CONFIG_PACKAGE_mkf2fs=y
        CONFIG_PACKAGE_pciutils=y
        CONFIG_PACKAGE_usbutils=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_zram-swap=y
        EOF
        
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        
        # 自动化依赖补全（生成最终完整的编译清单）
        make defconfig

    - name: SSH 远程调试 (tmate)
      uses: mxschmitt/action-tmate@v3
      continue-on-error: true
      if: (github.event.inputs.ssh == 'true')
      with:
        limit-access-to-actor: true

    - name: 下载软件包源码 (Download)
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 执行固件编译
      id: compile
      run: |
        cd openwrt
        ccache -M 5G
        echo -e "$(nproc) 线程编译中..."
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 整理输出文件
      id: organize
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        cd openwrt/bin/targets/mediatek/filogic/
        cp -f *.bin $GITHUB_WORKSPACE/output/ || true
        cp -f *.tar.gz $GITHUB_WORKSPACE/output/ || true
        # 将输出路径存入输出变量
        echo "FIRMWARE_PATH=$GITHUB_WORKSPACE/output" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件至工作流附件 (Artifacts)
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_MT5000_固件_${{ github.event.inputs.source_branch }}
        path: ${{ steps.organize.outputs.FIRMWARE_PATH }}
        retention-days: 7

    - name: 生成发布标签 (Release Tag)
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        echo "release_tag=MT5000-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        echo "release_date=$(date +"%Y.%m.%d")" >> $GITHUB_OUTPUT
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 发布至 GitHub Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.status == 'success' && !cancelled()
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        files: ${{ steps.organize.outputs.FIRMWARE_PATH }}/*
        body: |
          ## GL-MT5000 (Beryl AX) 固件发布
          - 📅 编译日期: ${{ steps.tag.outputs.release_date }}
          - 📂 配置目录: config/${{ github.event.inputs.source_branch }}
          - 🔗 源码分支: ${{ env.REPO_BRANCH }}
          - 🛠️ 说明: 固件已集成你要求的 WebUI 插件及基础驱动。
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧运行记录
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3
        token: ${{ secrets.GITHUB_TOKEN }}
