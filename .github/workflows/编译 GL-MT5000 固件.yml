#============================================================================================
# Description: Build OpenWrt for GL-MT5000
#============================================================================================

name: 编译 GL-MT5000 固件

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "选择源码分支"
        required: false
        default: "aqr-k-MT5000"
        type: choice
        options:
          - aqr-k-MT5000
          - openwrt-main
          - immortalwrt-master

env:
  FEEDS_CONF: config/${{ inputs.source_branch }}/feeds.conf.default
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  DIY_P1_SH: config/${{ inputs.source_branch }}/diy-part1.sh
  DIY_P2_SH: config/${{ inputs.source_branch }}/diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}

    steps:
      - name: 检查项目分支
        uses: actions/checkout@main

      - name: 初始化编译环境
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi `docker images -q`
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android 2>/dev/null
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://is.gd/depend_ubuntu2204_openwrt)
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo mkdir -p /workdir
          sudo chown ${USER}:${GROUPS} /workdir
          sudo timedatectl set-timezone "${TZ}"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 克隆源码 [ ${{ inputs.source_branch }} ]
        id: codes
        working-directory: /workdir
        if: steps.init.outputs.status == 'success' && !cancelled()
        run: |
          if [[ "${{ inputs.source_branch }}" == *"aqr-k"* ]]; then
              REPO_URL="https://github.com/aqr-k/openwrt"
              REPO_BRANCH="MT5000"
          elif [[ "${{ inputs.source_branch }}" == *"openwrt"* ]]; then
              REPO_URL="https://github.com/openwrt/openwrt"
              REPO_BRANCH="main"
          elif [[ "${{ inputs.source_branch }}" == *"immortalwrt"* ]]; then
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
              REPO_BRANCH="master"
          else
              echo "Unknown source code repository."
              exit 1
          fi

          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt
          ln -sf /workdir/openwrt ${GITHUB_WORKSPACE}/openwrt
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 加载自定义 Feeds
        run: |
          [[ -f "${FEEDS_CONF}" ]] && cp -f ${FEEDS_CONF} openwrt/feeds.conf.default
          [[ -f "${DIY_P1_SH}" ]] && chmod +x ${DIY_P1_SH} && cd openwrt/ && ${GITHUB_WORKSPACE}/${DIY_P1_SH} || true

      - name: 更新并安装 Feeds
        run: |
          cd openwrt/
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载自定义配置与设置 MT5000
        run: |
          [[ -d "files" ]] && mv -f files openwrt/files
          [[ -e "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
          
          # =======================================================
          # 关键修改 1: 强制指定只编译 MT5000 设备
          # =======================================================
          echo "CONFIG_TARGET_mediatek=y" >> openwrt/.config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> openwrt/.config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt5000=y" >> openwrt/.config
          
          # =======================================================
          # 关键修改 2: 修改 overlay 大小为 8GB (8192 MB)
          # =======================================================
          echo "CONFIG_TARGET_KERNEL_PARTSIZE=32" >> openwrt/.config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=8192" >> openwrt/.config
          
          # 移除可能冲突的其他多余 Target 设备 (确保只编译你需要的那台)
          sed -i 's/^[ \t]*//g' openwrt/.config
          
          [[ -f "${DIY_P2_SH}" ]] && chmod +x ${DIY_P2_SH} && cd openwrt/ && ${GITHUB_WORKSPACE}/${DIY_P2_SH} || true

      - name: 下载依赖包
        id: package
        run: |
          cd openwrt/
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: 编译 OpenWrt
        id: compile
        run: |
          cd openwrt/
          echo -e "$(nproc) thread compile"
          make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 检查空间使用情况
        if: (!cancelled())
        run: df -hT

      - name: 提取固件
        id: organize
        if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 生成 Release 标签
        id: tag
        if: env.UPLOAD_RELEASE == 'true' && !cancelled()
        run: |
          echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> ${GITHUB_OUTPUT}
          touch release.txt
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: 上传固件至 Release
        uses: softprops/action-gh-release@v1
        if: steps.tag.outputs.status == 'success' && !cancelled()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body: |
            ### GL-MT5000 (Beryl AX) 编译固件
            - 源码: ${{ inputs.source_branch }}
            - 特性: 已指定 8GB (8192MB) Overlay 分区大小。
            - 默认 IP: 192.168.1.1 (取决于你的 diy-part2.sh 配置)
            - 默认密码: 无 / password
          files: ${{ env.FIRMWARE }}/*

      - name: 删除旧的 Workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 1
          keep_minimum_runs: 3
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
